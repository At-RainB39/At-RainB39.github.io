<!-- 初心者がGeminiに働かせた産物 -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lib Home</title>
  <!-- Tailwind CSS の読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (見やすい等幅数字対応のフォント) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* 数字の幅を固定して秒数が変わってもガタつかないようにする */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* スクロールバーのカスタマイズ（すっきり見せる） */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    /* 長押し時のブラウザ標準プレビュー・選択メニューを徹底防止 */
    .shortcut-card,
    .shortcut-card * {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
    }
    .shortcut-card {
      touch-action: manipulation;
    }
    .shortcut-card.is-touch-dragging {
      touch-action: none;
      opacity: 0.55;
      transform: scale(1.06);
      z-index: 30;
    }
    /* ドラッグ中のエフェクト用クラス */
    .dragging {
      opacity: 0.4;
      transform: scale(0.92);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .drag-over {
      border-color: #3b82f6 !important;
      background-color: rgba(59, 130, 246, 0.08) !important;
      transform: scale(1.04);
      transition: all 0.2s ease;
    }
    /* カードの並べ替えトランジション */
    #shortcuts-grid > div {
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
    }

    /* 鉄道車両風リボン帯のスタイル */
    .train-ribbon {
      position: relative;
      background-color: #1e293b;
      clip-path: polygon(
        0 0, 
        100% 0, 
        calc(100% - 22px) 50%, 
        100% 100%, 
        0 100%, 
        22px 50%
      );
      box-shadow: 0 12px 30px -5px rgba(15, 23, 42, 0.35);
    }
    @media (prefers-color-scheme: light) {
      .train-ribbon {
        background-color: #1e3a8a;
      }
    }
    /* 細いアクセントライン（上側） #F45A47 */
    .train-ribbon::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 3px;
      background-color: #F45A47;
      z-index: 1;
    }
    /* 細いアクセントライン（下側） #F45A47 */
    .train-ribbon::after {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      height: 3px;
      background-color: #F45A47;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 transition-colors duration-300 relative overflow-x-hidden">

  <!-- 背景画像＆紺色オーバーレイレイヤー -->
  <div id="bg-layer" class="fixed inset-0 -z-20 bg-cover bg-center bg-no-repeat transition-opacity duration-500 opacity-0 pointer-events-none"></div>
  <div id="bg-overlay" class="fixed inset-0 -z-10 bg-slate-950/75 backdrop-blur-[2px] transition-opacity duration-500 opacity-0 pointer-events-none"></div>

  <!-- 右上の背景設定ボタン（PC・タブレットでは画面右上に固定し、時計リボンと同じ行・高さに共存させる） -->
  <div class="w-full max-w-6xl flex justify-end mb-2 sm:mb-0 sm:fixed sm:top-5 sm:right-6 sm:w-auto z-30">
    <button id="open-bg-modal-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border border-slate-200/80 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 shadow-xs transition-all cursor-pointer">
      <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span>背景設定</span>
    </button>
  </div>

  <!-- メインコンテナ -->
  <main class="w-full max-w-6xl flex flex-col items-center gap-6 sm:gap-8 relative z-10">
    
    <!-- ① 時計パーツ（左右分割：左＝時分秒の半分サイズの2段組み、右＝統一サイズの時分秒） -->
    <header aria-label="現在の日時" class="select-none w-full flex justify-center">
      <div class="train-ribbon px-9 py-4 sm:px-11 sm:py-4 text-white shadow-xl">
        <div class="relative z-10 flex items-center justify-center gap-4 sm:gap-6 text-white">
          
          <!-- 左側区画：上下分割（時分秒の1/2のフォントサイズ・行間で高さを揃える） -->
          <div class="flex flex-col items-start justify-between border-r border-white/25 pr-4 sm:pr-6 text-[15px] sm:text-[18px] leading-none">
            <!-- 上段：和暦・西暦（色を白に統一） -->
            <div class="flex items-center tabular-nums font-bold text-white whitespace-nowrap">
              <span id="clock-wareki">令和8</span>年(<span id="clock-seireki">2026</span>年)
            </div>
            <!-- 下段：月日・曜日 -->
            <div class="flex items-center tabular-nums font-bold text-white whitespace-nowrap mt-0.5 sm:mt-1">
              <span id="clock-date">11/20</span><span id="clock-day" class="ml-1 text-white font-bold">(金)</span>
            </div>
          </div>

          <!-- 右側区画：時分秒（サイズを統一・PC/タブレットではスリムに調整） -->
          <div class="flex items-center tabular-nums font-bold tracking-tight text-[30px] sm:text-[36px] leading-none whitespace-nowrap text-white">
            <span id="clock-hm">00:05</span><span id="clock-sec">:00</span>
          </div>

        </div>
      </div>
    </header>

    <!-- ② 検索バーエリア -->
    <section aria-label="ウェブ検索" class="w-full max-w-2xl">
      <form id="search-form" target="_blank" class="relative flex items-center w-full bg-white/95 dark:bg-slate-900/90 backdrop-blur-md rounded-full shadow-sm border border-slate-200/90 dark:border-slate-800 focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:border-blue-500 transition-all">
        
        <!-- 検索エンジン選択プルダウン -->
        <select id="search-engine" aria-label="検索エンジンを選択" class="pl-4 pr-2 py-3.5 bg-transparent text-sm font-semibold text-slate-600 dark:text-slate-300 focus:outline-none cursor-pointer rounded-l-full">
          <option value="https://www.google.com/search?q=" class="dark:bg-slate-900">Google</option>
          <option value="https://search.yahoo.co.jp/search?p=" class="dark:bg-slate-900">Yahoo!</option>
          <option value="https://www.bing.com/search?q=" class="dark:bg-slate-900">Bing</option>
          <option value="https://duckduckgo.com/?q=" class="dark:bg-slate-900">DuckDuckGo</option>
          <option value="https://www.youtube.com/results?search_query=" class="dark:bg-slate-900">YouTube</option>
        </select>

        <div class="w-px h-5 bg-slate-200 dark:bg-slate-700"></div>

        <!-- 検索ワード入力欄 -->
        <input 
          type="text" 
          id="search-input" 
          placeholder="検索キーワード、またはURLを入力..." 
          autocomplete="off"
          class="w-full px-4 py-3.5 bg-transparent text-base text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none"
        >

        <!-- 検索ボタン -->
        <button type="submit" aria-label="検索を実行" class="pr-5 pl-3 py-3.5 text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"></path>
          </svg>
        </button>
      </form>
    </section>

    <!-- ③ メインのショートカット（ファビコン）置き場 -->
    <section aria-label="ショートカット一覧" class="w-full flex flex-col gap-3">
      
      <!-- ツールバー（編集・追加ボタン） -->
      <div class="flex items-center justify-end px-1">
        <div class="flex items-center gap-2">
          <!-- 編集（削除・並べ替え）モード切替ボタン -->
          <button id="toggle-edit-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <span id="toggle-edit-text">整理・削除</span>
          </button>

          <!-- 新規追加ボタン -->
          <button id="open-add-modal-btn" type="button" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>追加</span>
          </button>
        </div>
      </div>

      <!-- ショートカットカードグリッド（スマホで最低3列を確保） -->
      <div id="shortcuts-grid" class="grid grid-cols-3 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 xl:grid-cols-12 gap-2.5 sm:gap-3">
        <!-- JavaScriptでここにショートカットカードが生成されます -->
      </div>

      <!-- 下部フッターバー（左：インポート・エクスポート） -->
      <div class="flex items-center justify-start gap-2 px-1 pt-2">
        <button id="import-json-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border border-rose-400 dark:border-rose-600 bg-rose-50/90 dark:bg-rose-950/50 backdrop-blur-xs text-rose-700 dark:text-rose-300 hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-colors cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
          </svg>
          <span>インポート</span>
        </button>
        <input type="file" id="import-json-input" accept=".json,application/json" class="hidden">

        <button id="export-json-btn" type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-xl border border-emerald-400 dark:border-emerald-600 bg-emerald-50/90 dark:bg-emerald-950/50 backdrop-blur-xs text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 dark:hover:bg-emerald-900/60 transition-colors cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
          </svg>
          <span>エクスポート</span>
        </button>
      </div>

    </section>

  </main>

  <!-- ショートカット追加・編集用モーダル -->
  <div id="shortcut-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modal-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">ショートカットを追加</h3>
        <button id="close-modal-btn" type="button" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form id="shortcut-form" class="flex flex-col gap-4">
        <input type="hidden" id="edit-index" value="-1">
        
        <div>
          <label for="site-url" class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">URL <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            id="site-url" 
            required 
            placeholder="https://example.com" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <div>
          <label for="site-title" class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">タイトル（省略時はドメイン名）</label>
          <input 
            type="text" 
            id="site-title" 
            placeholder="例: YouTube, Gmail, ニュース..." 
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <!-- カスタムファビコン手動設定 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1.5">カスタムアイコン（任意・手動設定）</label>
          <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
            <div class="w-11 h-11 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
              <img id="icon-preview-img" src="" alt="プレビュー" class="w-7 h-7 object-contain hidden">
              <span id="icon-preview-placeholder" class="text-[10px] text-slate-400 font-semibold">自動</span>
            </div>
            <div class="flex flex-wrap items-center gap-2 flex-1">
              <label for="site-icon-file" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 cursor-pointer transition-colors">
                画像を選択
              </label>
              <input type="file" id="site-icon-file" accept="image/*" class="hidden">
              <button type="button" id="clear-icon-btn" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 hidden cursor-pointer transition-colors">
                自動に戻す
              </button>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-end gap-2 mt-2">
          <button id="cancel-modal-btn" type="button" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
            キャンセル
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors cursor-pointer">
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 背景設定モーダル -->
  <div id="bg-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">背景画像の設定</h3>
        <button id="close-bg-modal-btn" type="button" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">
        お好みの壁紙を選択できます。時計やアイコンが見づらくならないよう、画像の上に半透明の深い紺色フィルターを自動で重ねます。
      </p>

      <!-- プレビュー枠 -->
      <div class="relative w-full h-36 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 mb-4 flex items-center justify-center">
        <div id="bg-modal-preview" class="absolute inset-0 bg-cover bg-center hidden"></div>
        <div id="bg-modal-preview-overlay" class="absolute inset-0 bg-slate-950/75 hidden items-center justify-center">
          <span class="text-xs font-bold text-slate-200 tracking-wider">紺色オーバーレイ適用プレビュー</span>
        </div>
        <span id="bg-modal-empty-text" class="text-xs text-slate-400 font-medium">背景画像は未設定です</span>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-2">
        <label for="bg-file-input" class="w-full sm:w-auto flex-1 text-center px-4 py-2.5 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm cursor-pointer transition-colors">
          画像ファイルを選択
        </label>
        <input type="file" id="bg-file-input" accept="image/*" class="hidden">

        <button id="remove-bg-btn" type="button" class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-950/70 transition-colors cursor-pointer hidden">
          背景を削除
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 dark:bg-slate-700 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg">
    メッセージ
  </div>

  <!-- 削除確認カスタムモーダル -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-6 text-center">
      <div class="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-500 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <h3 id="confirm-title" class="text-base font-bold text-slate-800 dark:text-slate-100 mb-1">ショートカットの削除</h3>
      <p id="confirm-text" class="text-xs text-slate-500 dark:text-slate-400 mb-6">「〇〇」を削除してもよろしいですか？</p>
      <div class="flex items-center justify-center gap-2">
        <button id="confirm-cancel-btn" type="button" class="w-full px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer border border-slate-200 dark:border-slate-700">
          キャンセル
        </button>
        <button id="confirm-ok-btn" type="button" class="w-full px-4 py-2.5 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition-colors cursor-pointer">
          削除する
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 0. IndexedDB Helper
    // ==========================================
    const DB_NAME = 'MyStartPageDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'appData';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function dbGet(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.error('IndexedDB 読み込みエラー:', e);
        return null;
      }
    }

    async function dbSet(key, value) {
      try {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.error('IndexedDB 保存エラー:', e);
        showToast('データの保存に失敗しました');
      }
    }

    async function dbDelete(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.error('IndexedDB 削除エラー:', e);
      }
    }

    // ==========================================
    // 1. Clock Logic
    // ==========================================
    function updateClock() {
      try {
        const now = new Date();
        const year = now.getFullYear();
        
        let eraName = '令和';
        let eraYear = year - 2018;
        if (year < 2019 || (year === 2019 && now.getMonth() < 4)) {
          eraName = '平成';
          eraYear = year - 1988;
        }
        
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        const dayIndex = now.getDay();
        const dayStr = days[dayIndex];
        
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('clock-wareki').textContent = `${eraName}${eraYear}`;
        document.getElementById('clock-seireki').textContent = `${year}`;
        document.getElementById('clock-date').textContent = `${month}/${date}`;
        
        const dayEl = document.getElementById('clock-day');
        dayEl.textContent = `(${dayStr})`;
        if (dayIndex === 0) {
          dayEl.className = 'ml-1 text-rose-300 font-bold';
        } else if (dayIndex === 6) {
          dayEl.className = 'ml-1 text-sky-300 font-bold';
        } else {
          dayEl.className = 'ml-1 text-white font-bold';
        }

        document.getElementById('clock-hm').textContent = `${hours}:${minutes}`;
        document.getElementById('clock-sec').textContent = `:${seconds}`;
      } catch (error) {
        console.error('時計の更新中にエラーが発生しました:', error);
      }
    }

    // ==========================================
    function setupSearch() {
      const form = document.getElementById('search-form');
      const input = document.getElementById('search-input');
      const engineSelect = document.getElementById('search-engine');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        let targetUrl = '';
        if (/^(https?:\/\/)/i.test(query)) {
          targetUrl = query;
        } else if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(query) && !query.includes(' ')) {
          targetUrl = 'https://' + query;
        } else {
          targetUrl = engineSelect.value + encodeURIComponent(query);
        }

        window.open(targetUrl, '_blank', 'noopener,noreferrer');
        input.value = '';
      });
    }

    function renderShortcuts() {

        card.dataset.index = index;

        // ブラウザ標準の長押しプレビュー・コンテキストメニュー・選択を徹底防止
        card.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();

        card.addEventListener('selectstart', (e) => e.preventDefault());

        // PCブラウザ用 HTML5 ドラッグ＆ドロップ
        card.addEventListener('dragstart', (e) => {
          dragSrcIndex = index;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => card.classList.add('dragging'), 0);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearDragHighlights();
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });

        card.addEventListener('drop', async (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          if (dragSrcIndex === null || dragSrcIndex === index) return;

          const movedItem = shortcuts.splice(dragSrcIndex, 1)[0];
          shortcuts.splice(index, 0, movedItem);
          dragSrcIndex = null;
          await saveShortcuts();
          renderShortcuts();
          showToast('ショートカットの順番を並べ替えました');
        });

        // スマホ・タブレット用 長押しドラッグ＆ドロップ
        card.addEventListener('touchstart', (e) => {
          if (e.target.closest('button')) return;
          if (e.touches.length !== 1) return;

          const touch = e.touches[0];
          touchDragState.startX = touch.clientX;
          touchDragState.startY = touch.clientY;
          touchDragState.srcIndex = index;
          touchDragState.targetIndex = index;
          touchDragState.isDragging = false;
          touchDragState.justDragged = false;

          clearTimeout(touchDragState.timer);
          touchDragState.timer = setTimeout(() => {
            touchDragState.isDragging = true;
            touchDragState.justDragged = true;
            card.classList.add('is-touch-dragging');
            if (navigator.vibrate) {
              navigator.vibrate(30);
            }
          }, 320);
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          if (!touchDragState.isDragging) {
            const touch = e.touches[0];
            const dx = Math.abs(touch.clientX - touchDragState.startX);
            const dy = Math.abs(touch.clientY - touchDragState.startY);
            // 長押し成立前に指が大きく動いたら通常の画面スクロールとみなしてタイマー解除
            if (dx > 8 || dy > 8) {
              clearTimeout(touchDragState.timer);
            }
            return;
          }

          // ドラッグ中は画面スクロールやブラウザの標準挙動を止める
          if (e.cancelable) e.preventDefault();

          const touch = e.touches[0];
          const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetCard = elemBelow ? elemBelow.closest('.shortcut-card') : null;

          document.querySelectorAll('#shortcuts-grid > div').forEach(el => el.classList.remove('drag-over'));
          if (targetCard && targetCard.dataset.index !== undefined) {
            const overIdx = parseInt(targetCard.dataset.index, 10);
            touchDragState.targetIndex = overIdx;
            if (overIdx !== touchDragState.srcIndex) {
              targetCard.classList.add('drag-over');
            }
          }
        }, { passive: false });

        const finishTouchDrag = async () => {
          clearTimeout(touchDragState.timer);
          if (touchDragState.isDragging) {
            const fromIdx = touchDragState.srcIndex;
            const toIdx = touchDragState.targetIndex;
            touchDragState.isDragging = false;
            clearDragHighlights();

            if (fromIdx !== null && toIdx !== null && fromIdx !== toIdx) {
              const movedItem = shortcuts.splice(fromIdx, 1)[0];
              shortcuts.splice(toIdx, 0, movedItem);
              await saveShortcuts();
              renderShortcuts();
              showToast('ショートカットの順番を並べ替えました');
            }
            setTimeout(() => {
              touchDragState.justDragged = false;
            }, 100);
          }
        };

        card.addEventListener('touchend', finishTouchDrag);
        card.addEventListener('touchcancel', finishTouchDrag);

        // <a href="..."> の代わりに role="link" の div を使用することで、
        // iOS Safari / Android Chrome における長押し時の「リンクプレビュー」ポップアップを完全に無効化

        const img = document.createElement('img');

          delBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            promptDelete(index);
          });
          card.appendChild(delBtn);
        }

        grid.appendChild(card);
      });

      const addCard = document.createElement('button');

      addCard.className = 'group flex flex-col items-center justify-center p-1.5 sm:p-2 rounded-2xl text-slate-600 dark:text-slate-200 hover:text-blue-500 transition-transform hover:scale-105 cursor-pointer';

          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">

        <span class="text-xs sm:text-[13px] font-semibold drop-shadow-[0_1px_2px_rgba(255,255,255,0.8)] dark:drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]">追加</span>

    function resizeIconImage(file, maxSize = 128) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxSize) {
                height *= maxSize / width;
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width *= maxSize / height;
                height = maxSize;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    let currentBgUrl = null;

    function applyBackground(dataUrl) {
      if (currentBgUrl && currentBgUrl.startsWith('blob:')) {
        URL.revokeObjectURL(currentBgUrl);
      }
      currentBgUrl = dataUrl;

      if (dataUrl) {
        bgLayer.style.backgroundImage = `url("${dataUrl}")`;
        bgLayer.classList.remove('opacity-0');
        bgOverlay.classList.remove('opacity-0');

        bgModalPreview.style.backgroundImage = `url("${dataUrl}")`;
        bgModalPreview.classList.remove('hidden');
        bgModalPreviewOverlay.classList.remove('hidden');
        bgModalPreviewOverlay.classList.add('flex');
        bgModalEmptyText.classList.add('hidden');
        removeBgBtn.classList.remove('hidden');
      } else {
        bgLayer.style.backgroundImage = 'none';
        bgLayer.classList.add('opacity-0');
        bgOverlay.classList.add('opacity-0');

        bgModalPreview.classList.add('hidden');
        bgModalPreviewOverlay.classList.add('hidden');
        bgModalPreviewOverlay.classList.remove('flex');
        bgModalEmptyText.classList.remove('hidden');
        removeBgBtn.classList.add('hidden');
      }
    }

      if (savedBgBlob instanceof Blob) {

    // ==========================================
    // 6. JSON Export & Import Logic (Base64対応)
    // ==========================================
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function base64ToBlob(dataUrl) {
      const response = await fetch(dataUrl);
      return await response.blob();
    }

    // エクスポート処理
    document.getElementById('export-json-btn').addEventListener('click', async () => {
      try {
        showToast('エクスポートデータを準備中...');
        const savedBg = await dbGet('backgroundImageBlob');
        let bgBase64 = null;

        if (savedBg instanceof Blob) {
          bgBase64 = await blobToBase64(savedBg);
        } else if (typeof savedBg === 'string' && savedBg.startsWith('data:')) {
          bgBase64 = savedBg;
        }

        const exportPayload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          shortcuts: shortcuts.map(item => ({
            title: item.title || '',
            url: item.url || '',
            hasCustomIcon: Boolean(item.customIcon),
            customIcon: item.customIcon || null
          })),
          background: {
            hasBackground: Boolean(bgBase64),
            imageData: bgBase64
          }
        };

        const jsonString = JSON.stringify(exportPayload, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const downloadUrl = URL.createObjectURL(blob);

        const now = new Date();
        const dateStamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `lib-home-backup-${dateStamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        showToast('JSONファイルをエクスポートしました');
      } catch (err) {
        console.error('エクスポートエラー:', err);
        showToast('エクスポートに失敗しました');
      }
    });

    // インポート処理
    const importJsonBtn = document.getElementById('import-json-btn');
    const importJsonInput = document.getElementById('import-json-input');

    importJsonBtn.addEventListener('click', () => {
      importJsonInput.click();
    });

    importJsonInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (!data || !Array.isArray(data.shortcuts)) {
          throw new Error('無効なJSONフォーマットです');
        }

        // 1. ショートカットデータの復元と保存
        const importedShortcuts = data.shortcuts
          .filter(item => item && typeof item.url === 'string' && item.url.trim() !== '')
          .map(item => ({
            title: String(item.title || '').trim() || item.url,
            url: normalizeUrl(item.url),
            customIcon: (item.hasCustomIcon !== false && typeof item.customIcon === 'string' && item.customIcon.startsWith('data:'))
              ? item.customIcon
              : null
          }));

        shortcuts = importedShortcuts;
        await saveShortcuts();
        renderShortcuts();

        // 2. 背景画像の復元と保存
        if (data.background && data.background.hasBackground && typeof data.background.imageData === 'string' && data.background.imageData.startsWith('data:')) {
          const bgBlob = await base64ToBlob(data.background.imageData);
          await dbSet('backgroundImageBlob', bgBlob);
          const objectUrl = URL.createObjectURL(bgBlob);
          applyBackground(objectUrl);
        } else {
          await dbDelete('backgroundImageBlob');
          applyBackground(null);
        }

        showToast('JSONデータをインポートして適用しました');
      } catch (err) {
        console.error('インポートエラー:', err);
        showToast('インポートに失敗しました（ファイル形式を確認してください）');
      } finally {
        importJsonInput.value = '';
      }
    });

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      updateClock();
      setInterval(updateClock, 1000);

      setupSearch();

      await loadBackground();
      await loadShortcuts();
      renderShortcuts();

      document.getElementById('open-add-modal-btn').addEventListener('click', () => openModal(-1));
      document.getElementById('close-modal-btn').addEventListener('click', closeModal);
      document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      const toggleEditBtn = document.getElementById('toggle-edit-btn');
      const toggleEditText = document.getElementById('toggle-edit-text');
      toggleEditBtn.addEventListener('click', () => {
        isEditMode = !isEditMode;
        if (isEditMode) {
          toggleEditBtn.classList.add('bg-amber-50', 'border-amber-400', 'text-amber-700', 'dark:bg-amber-950/50', 'dark:border-amber-600', 'dark:text-amber-300');
          toggleEditText.textContent = '完了';
        } else {
          toggleEditBtn.classList.remove('bg-amber-50', 'border-amber-400', 'text-amber-700', 'dark:bg-amber-950/50', 'dark:border-amber-600', 'dark:text-amber-300');
          toggleEditText.textContent = '整理・削除';
        }
        renderShortcuts();
      });

      document.getElementById('shortcut-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rawUrl = siteUrlInput.value.trim();
        if (!rawUrl) return;

        const normalizedUrl = normalizeUrl(rawUrl);
        let title = siteTitleInput.value.trim();

        if (!title) {
          try {
            title = new URL(normalizedUrl).hostname.replace(/^www\./, '');
          } catch (err) {
            title = rawUrl;
          }
        }

        const newItem = {
          title,
          url: normalizedUrl,
          customIcon: currentCustomIconDataUrl || null
        };

        const editIndex = parseInt(editIndexInput.value, 10);
        if (editIndex >= 0) {
          shortcuts[editIndex] = newItem;
          showToast('ショートカットを更新しました');
        } else {
          shortcuts.push(newItem);
          showToast(`「${title}」を追加しました`);
        }

        await saveShortcuts();
        renderShortcuts();
        closeModal();
      });
    });
  </script>
</body>
</html>
